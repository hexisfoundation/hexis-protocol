<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HEXIS — Whitepaper v0.7</title>
<style>
  :root{
    --bg:#0a0c10;--bg2:#0e1116;--panel:#12151b;--panel2:#171b22;
    --border:#1f2530;--border2:#2a3240;
    --text:#dce2ea;--body:#c3cad4;--muted:#8894a3;--dim:#565f6c;
    --accent:#7fa8b8;--accent-soft:rgba(127,168,184,.12);--accent-line:rgba(127,168,184,.42);
    --bright:#6bb6ff;--gold:#ffd24a;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
    --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--body);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}

  .layout{display:grid;grid-template-columns:270px 1fr;max-width:1200px;margin:0 auto}
  /* TOC */
  aside{border-right:1px solid var(--border);padding:30px 22px 60px;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:baseline;gap:9px;margin-bottom:4px}
  .mark{font-size:19px;font-weight:700;letter-spacing:3px}.mark b{color:var(--accent)}
  .pill{font-family:var(--mono);font-size:10.5px;color:var(--accent);background:var(--accent-soft);
    border:1px solid rgba(127,168,184,.25);padding:2px 8px;border-radius:100px}
  .st{font-size:11.5px;color:var(--dim);font-family:var(--mono);margin:6px 0 22px}
  #toc{display:flex;flex-direction:column;gap:1px}
  #toc a{color:var(--muted);font-size:12.5px;padding:6px 10px;border-radius:7px;line-height:1.4;border-left:2px solid transparent}
  #toc a:hover{color:var(--text);background:var(--panel);text-decoration:none}
  #toc a.on{color:var(--text);background:var(--panel);border-left-color:var(--accent)}
  #toc a.h2{padding-left:22px;font-size:12px;color:var(--dim)}
  #toc a.h2:hover,#toc a.h2.on{color:var(--text)}
  .back{margin-top:24px;display:block;font-family:var(--mono);font-size:12px;color:var(--dim)}

  main{min-width:0;padding:44px 56px 100px}
  .loading{color:var(--dim);font-family:var(--mono)}

  /* document typography */
  #doc{max-width:720px}
  #doc h1{font-size:34px;font-weight:720;letter-spacing:-.6px;line-height:1.2;color:var(--text);margin:0 0 6px;scroll-margin-top:24px}
  #doc h2{font-size:23px;font-weight:680;letter-spacing:-.3px;color:var(--text);margin:52px 0 16px;
    padding-top:26px;border-top:1px solid var(--border);scroll-margin-top:24px;display:flex;align-items:center;gap:12px}
  #doc h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;
    box-shadow:0 0 10px rgba(127,168,184,.7)}
  #doc h3{font-size:17px;font-weight:660;color:var(--accent);margin:32px 0 12px;scroll-margin-top:24px}
  #doc h4{font-size:14px;font-weight:660;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:24px 0 10px}
  #doc p{font-size:16.5px;line-height:1.8;color:var(--body);margin:0 0 18px}
  #doc strong{color:var(--text);font-weight:640}
  #doc em{color:var(--text)}
  #doc a{color:var(--bright)}
  #doc ul,#doc ol{margin:0 0 20px 4px;padding-left:24px}
  #doc li{font-size:16px;line-height:1.75;color:var(--body);margin-bottom:8px}
  #doc li::marker{color:var(--accent)}
  #doc hr{border:none;border-top:1px solid var(--border);margin:40px 0}
  #doc blockquote{border-left:3px solid var(--accent);background:linear-gradient(90deg,var(--accent-soft),transparent 70%);
    padding:14px 22px;margin:0 0 22px;border-radius:0 10px 10px 0;color:var(--text);font-size:17px;line-height:1.7}
  #doc blockquote p{margin:0;color:var(--text)}
  #doc code{font-family:var(--mono);font-size:13.5px;background:var(--panel2);border:1px solid var(--border);
    padding:2px 6px;border-radius:5px;color:var(--accent)}
  #doc pre{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:18px 20px;
    overflow-x:auto;margin:0 0 22px}
  #doc pre code{background:none;border:none;padding:0;color:var(--body);font-size:13px;line-height:1.7}
  #doc table{width:100%;border-collapse:collapse;margin:0 0 24px;font-size:14.5px;display:block;overflow-x:auto}
  #doc th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    font-weight:660;padding:11px 14px;border-bottom:2px solid var(--border2);background:var(--panel)}
  #doc td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--body);vertical-align:top}
  #doc tr:hover td{background:var(--panel)}

  @media(max-width:860px){
    .layout{grid-template-columns:1fr}
    aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}
    #toc{max-height:200px;overflow-y:auto}
    main{padding:28px 22px 70px}
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand"><span class="mark">HE<b>X</b>IS</span><span class="pill">v0.7</span></div>
    <div class="st">WHITEPAPER</div>
    <nav id="toc"><span class="loading">…</span></nav>
    <a class="back" href="/">← hexisfoundation.org</a>
    <a class="back" href="HEXIS_Whitepaper_v0.7.md">raw markdown ↗</a>
  </aside>
  <main><div id="doc"><div class="loading">Loading whitepaper…</div></div></main>
</div>

<script src="marked.min.js"></script>
<script>
(async()=>{
  const doc=document.getElementById('doc'), toc=document.getElementById('toc');
  let md;
  try{ md=await (await fetch('HEXIS_Whitepaper_v0.7.md')).text(); }
  catch(e){ doc.innerHTML='<div class="loading">Could not load the whitepaper.</div>'; return; }
  if(typeof marked==='undefined'){ doc.textContent=md; return; }
  marked.setOptions({gfm:true,breaks:false});
  doc.innerHTML=marked.parse(md);

  // build TOC from h1/h2
  const heads=[...doc.querySelectorAll('h1,h2')];
  toc.innerHTML='';
  heads.forEach((h,i)=>{
    h.id='s'+i;
    const a=document.createElement('a');
    a.href='#s'+i; a.textContent=h.textContent; a.className=h.tagName.toLowerCase();
    toc.appendChild(a);
  });
  const links=[...toc.querySelectorAll('a')];
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){
      links.forEach(l=>l.classList.toggle('on',l.getAttribute('href')==='#'+e.target.id));
    }});
  },{rootMargin:'-8% 0px -85% 0px'});
  heads.forEach(h=>io.observe(h));
})();
</script>
</body>
</html>
